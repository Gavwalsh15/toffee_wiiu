name: Install the Windows toolchain
description: >-
  Install the MinGW pinned in toolchain.json, Ninja and Python 3.12, the tools both the app build
  and the static Qt build use. The MinGW version has to match the one the static Qt was built with.

runs:
  using: composite
  steps:
    - name: Read the pinned MinGW
      id: pins
      shell: pwsh
      run: |
        $pins = Get-Content toolchain.json -Raw | ConvertFrom-Json
        "mingw=$($pins.mingw.qtTool)" >> $env:GITHUB_OUTPUT

    - name: Install MinGW and Ninja
      uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
      with:
        tools-only: true
        host: windows
        target: desktop
        tools: 'tools_${{ steps.pins.outputs.mingw }},qt.tools.win64_${{ steps.pins.outputs.mingw }} tools_ninja'
        cache: true

    - name: Install Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.12'
