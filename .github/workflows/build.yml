name: Build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: Version tag to publish, e.g v0.1.0. It must match project(VERSION) in CMakeLists.txt.
        required: false
        type: string
      prerelease:
        description: Mark the manual release as a prerelease.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Firmware (ESP32-C5)
    # A pull request from a branch of this repository is already built by its push.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build
        uses: ./.github/actions/firmware

      - name: Hand the firmware to the Windows job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware
          path: firmware-out
          if-no-files-found: error
          retention-days: 1

  build:
    name: Toffee (Windows)
    needs: firmware
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Work out the version
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.release_version }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          version=""
          prerelease=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME}"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$MANUAL_VERSION" ]]; then
            version="${MANUAL_VERSION}"
            prerelease="${MANUAL_PRERELEASE}"
          fi

          if [[ -n "$version" && ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::The release version must look like v0.1.0 or v0.1.0-rc1, not '$version'."
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Download the firmware
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware
          path: firmware-out

      - name: Build
        uses: ./.github/actions/windows-app
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Upload the app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toffee-windows
          path: |
            dist/Toffee.exe
            dist/toffee-cli.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload the firmware bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toffee-firmware
          path: build/firmware-app
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    name: Publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: needs.build.outputs.version != ''
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - name: Checkout release target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag points at this build
        shell: bash
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            tagged_commit=$(git rev-parse "refs/tags/${RELEASE_VERSION}^{commit}")
            built_commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
            if [[ "$tagged_commit" != "$built_commit" ]]; then
              echo "::error::Tag $RELEASE_VERSION does not point to the source built by this run."
              exit 1
            fi
          fi

      - name: Download build artifacts
        shell: bash
        run: |
          mkdir -p release/app release/firmware
          gh run download "$GITHUB_RUN_ID" --name toffee-windows --dir release/app
          gh run download "$GITHUB_RUN_ID" --name toffee-firmware --dir release/firmware

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p release/assets
          cp release/app/Toffee.exe "release/assets/toffee-${RELEASE_VERSION}-windows-x64.exe"
          cp release/app/toffee-cli.exe "release/assets/toffee-cli-${RELEASE_VERSION}-windows-x64.exe"
          (cd release/firmware && zip -r "../assets/toffee-${RELEASE_VERSION}-firmware.zip" .)
          (cd release/assets && sha256sum *.zip *.exe > SHA256SUMS.txt)

      - name: Publish GitHub release
        shell: bash
        run: |
          args=(
            release create "$RELEASE_VERSION"
            release/assets/*.zip
            release/assets/*.exe
            release/assets/SHA256SUMS.txt
            --target "$GITHUB_SHA"
            --title "Toffee ${RELEASE_VERSION}"
            --generate-notes
          )

          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
